<!DOCTYPE html>
<html lang="ja" data-theme="system">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6fbf2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101510" media="(prefers-color-scheme: dark)">
<meta name="description" content="漸進性過負荷に基づいて重量を提案する筋トレ記録アプリ">
<title>LiftLog — 筋トレ記録</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,700;112,800&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&family=Roboto:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block">
<link rel="stylesheet" href="./css/style.css">
<script>
  /* テーマのちらつき防止：CSS適用前に保存済みの設定を反映する */
  try {
    var t = localStorage.getItem('liftlog.theme') || 'system';
    document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>

<!-- Material Symbols 相当のアイコンを SVG スプライトとして内蔵（オフラインでも欠けない） -->

<header class="md-top-app-bar" id="topBar">
  <a class="ll-brand md-top-app-bar__leading" href="#/home" aria-label="LiftLog ホーム">
    <span class="ll-brand-mark" aria-hidden="true">
      <i style="background:#d7263d"></i><i style="background:#1e5fbe"></i><i style="background:#f0c000"></i>
      <i style="background:#a9b3c4"></i><i style="background:#1c9e4b"></i><i style="background:#a9b3c4"></i>
      <i style="background:#f0c000"></i><i style="background:#1e5fbe"></i><i style="background:#d7263d"></i>
    </span>
  </a>
  <h1 class="md-top-app-bar__headline" id="screenTitle">LiftLog</h1>
  <span id="netState" class="md-chip md-chip--static md-label-medium">未接続</span>
</header>

<main id="view" class="md-pane"></main>

<nav class="md-navigation-bar" aria-label="メインナビゲーション">
  <a class="md-navigation-bar__item" data-tab="home" href="#/home">
    <span class="md-navigation-bar__indicator md-state"><span class="material-symbols-rounded">play_arrow</span></span>
    <span class="md-navigation-bar__label">ワークアウト</span>
  </a>
  <a class="md-navigation-bar__item" data-tab="dashboard" href="#/dashboard">
    <span class="md-navigation-bar__indicator md-state"><span class="material-symbols-rounded">bar_chart</span></span>
    <span class="md-navigation-bar__label">レポート</span>
  </a>
  <a class="md-navigation-bar__item" data-tab="guides" href="#/guides">
    <span class="md-navigation-bar__indicator md-state"><span class="material-symbols-rounded">menu_book</span></span>
    <span class="md-navigation-bar__label">種目解説</span>
  </a>
  <a class="md-navigation-bar__item" data-tab="settings" href="#/settings">
    <span class="md-navigation-bar__indicator md-state"><span class="material-symbols-rounded">settings</span></span>
    <span class="md-navigation-bar__label">設定</span>
  </a>
</nav>

<div id="scrim" class="md-scrim" hidden>
  <div class="md-sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="md-sheet__handle"></div>
    <button class="md-icon-button md-state md-sheet__close" data-close="1" aria-label="閉じる">
      <span class="material-symbols-rounded">close</span>
    </button>
    <div id="sheetBody"></div>
  </div>
</div>

<div id="snackbarHost" class="md-snackbar-host" role="status" aria-live="polite"></div>

<div id="loading" class="md-loading" hidden>
  <div class="md-loading__spinner"></div>
  <div class="md-label-large" style="color:var(--md-sys-color-on-surface)">通信中…</div>
</div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
